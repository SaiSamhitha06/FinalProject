<!DOCTYPE html>
<html lang="en">
<head>
    <title>Upload Assignment</title>
</head>
<body>
    <h2>Upload Assignment Link</h2>
    
    <!-- Success/Failure Message Display -->
    {% if message %}
        <p style="color: green;">{{ message }}</p>
    {% elif error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="https://finalproject-6dtp.onrender.com/upload_assignment" method="POST">
        <label for="teacher_email">Teacher Email:</label>
        <input type="email" id="teacher_email" name="teacher_email" required><br><br>

        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" required><br><br>
        
        <label for="class_name">Class:</label>
        <input type="text" id="class_name" name="class_name" required placeholder="Enter class name"><br><br>

        <label for="assignment_link">Assignment Link:</label>
        <input type="url" id="assignment_link" name="assignment_link" required><br><br>
        
        <button type="submit">Submit</button>
    </form>
</body> 
</html>
